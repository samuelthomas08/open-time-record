name: Release

on:
  push:
    branches: [release]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from tag
        id: version
        run: |
          if ! VERSION=$(git describe --tags --exact-match --match 'v[0-9]*' HEAD 2>/dev/null); then
            echo "::error::HEAD is not tagged with a version (expected e.g. v1.4.0)." \
              "Tag this commit and push the tag before pushing to release."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: otr-backend
          file: otr-backend/otr-backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/samuelthomas08/otr-backend:${{ steps.version.outputs.version }}
            ghcr.io/samuelthomas08/otr-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: otr-frontend
          file: otr-frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/samuelthomas08/otr-frontend:${{ steps.version.outputs.version }}
            ghcr.io/samuelthomas08/otr-frontend:latest

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --title "${{ steps.version.outputs.version }}" \
            --generate-notes \
            deploy/docker-compose.yml deploy/.env.example
