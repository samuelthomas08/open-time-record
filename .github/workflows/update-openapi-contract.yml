name: Update OpenAPI Contract

# The Angular API client is NOT committed. It is generated from otr-frontend/openapi/openapi.json
# on every `npm start|build|test`. This workflow keeps that contract file in sync with the backend.
on:
  push:
    branches: [master]
    paths:
      - 'otr-backend/**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build backend (writes otr-frontend/openapi/openapi.json)
        run: dotnet build
        working-directory: otr-backend/otr-backend

      - name: Commit updated contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add otr-frontend/openapi/openapi.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "chore: update openapi contract from backend changes"
          git push
