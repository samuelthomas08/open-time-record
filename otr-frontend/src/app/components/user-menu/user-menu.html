<button
  z-dropdown
  [zDropdownMenu]="menu"
  zAlign="end"
  class="flex size-8 shrink-0 items-center justify-center overflow-hidden rounded-full bg-muted text-xs font-medium text-muted-foreground transition-opacity hover:opacity-80"
  aria-label="Benutzermenü"
>
  @if (profilePicturesEnabled() && pictureSrc()) {
    <img [src]="pictureSrc()" alt="" class="size-full object-cover" />
  } @else {
    {{ initials() }}
  }
</button>

<z-dropdown-menu-content #menu="zDropdownMenuContent" class="w-64">
  <z-dropdown-menu-label>
    <div class="flex items-center gap-3 py-1">
      @if (profilePicturesEnabled()) {
        <div
          class="flex size-10 shrink-0 items-center justify-center overflow-hidden rounded-full bg-muted text-sm font-medium text-muted-foreground"
        >
          @if (pictureSrc()) {
            <img [src]="pictureSrc()" alt="" class="size-full object-cover" />
          } @else {
            {{ initials() }}
          }
        </div>
      }
      <div class="flex min-w-0 flex-col gap-0.5">
        <p class="truncate text-sm font-medium text-foreground">{{ fullName() }}</p>
        <p class="truncate text-xs font-normal text-muted-foreground">{{ user()?.email }}</p>
      </div>
    </div>
  </z-dropdown-menu-label>

  <z-dropdown-menu-separator />
  <a z-dropdown-menu-item routerLink="/settings/profile">Profil</a>
  <a z-dropdown-menu-item routerLink="/settings">Einstellungen</a>
  <z-dropdown-menu-item (click)="logout()">Abmelden</z-dropdown-menu-item>
</z-dropdown-menu-content>
